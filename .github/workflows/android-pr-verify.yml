name: Android PR verification

on:
  pull_request:
    paths:
      - 'android/**'
      - 'packages/host/**'
      - 'packages/protocol/**'
      - '.github/workflows/android-pr-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: native/relayquic/go.sum
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install pinned NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android unit tests and debug APK
        working-directory: android
        run: sh ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process --max-workers=2 :app:testDebugUnitTest :app:assembleDebug
      - name: Preserve debug APK and unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-Android-PR-debug
          if-no-files-found: warn
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/test-results/testDebugUnitTest/
