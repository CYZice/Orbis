name: Orbis QA release APK

on:
  push:
    branches: [feat/android-compact-home-recent-projects-20261119]
    paths:
      - 'android/**'
      - '.github/workflows/android-qa-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: native/relayquic/go.sum
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install native toolchain
        run: sdkmanager 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build independently signed Orbis QA release
        working-directory: android
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/orbis-qa.jks"
          secret=$(openssl rand -hex 18)
          trap 'rm -f "$keystore"' EXIT
          keytool -genkeypair -noprompt -keyalg RSA -keysize 3072 -validity 365 \
            -alias orbisqa -dname "CN=Orbis QA Build" -keystore "$keystore" \
            -storepass "$secret" -keypass "$secret" >/dev/null
          ORG_GRADLE_PROJECT_ORBIS_RELEASE_STORE_FILE="$keystore" \
          ORG_GRADLE_PROJECT_ORBIS_RELEASE_STORE_PASSWORD="$secret" \
          ORG_GRADLE_PROJECT_ORBIS_RELEASE_KEY_ALIAS="orbisqa" \
          ORG_GRADLE_PROJECT_ORBIS_RELEASE_KEY_PASSWORD="$secret" \
            sh ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process --max-workers=2 \
              -PorbisQaBuild=true :app:assembleRelease
          mkdir -p ../.artifacts/android
          cp app/build/outputs/apk/release/app-release.apk ../.artifacts/android/orbis-qa-release.apk
          (cd ../.artifacts/android && sha256sum orbis-qa-release.apk > orbis-qa-release.apk.sha256)
      - name: Verify independently signed APK
        run: |
          set -euo pipefail
          apk=.artifacts/android/orbis-qa-release.apk
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/apksigner" verify --print-certs "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Orbis-QA-release-apk
          if-no-files-found: error
          path: |
            .artifacts/android/orbis-qa-release.apk
            .artifacts/android/orbis-qa-release.apk.sha256
